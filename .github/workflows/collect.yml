name: Collect solar readings
run-name: Collect (${{ github.event_name == 'schedule' && 'chain' || inputs.mode }})

# Polls every 5 minutes, 24/7, as a never-ending CHAIN of runs: each run loops internally
# (collector/run_loop.py, real `sleep`, clock-aligned) for up to 340 min - a GitHub-hosted
# job dies at 6h - and ~10 min before that cap dispatches its own successor
# (.github/scripts/collect_handoff.sh -> `gh workflow run`), so the two overlap briefly
# instead of leaving a gap. Night-time polls are cheap no-ops (the inverter is offline, so
# its last reading just dedupes), and running round the clock means there's no daily
# start/stop boundary for a delayed kickoff to miss.
#
# Why chain instead of one `schedule:` entry per segment: GitHub's scheduler has been
# starting these runs 3.5-4.5h late, every day (observed Oct 2026 - far worse than the
# "tens of minutes" of jitter fixed segments with 1h overlaps were sized for), which left a
# 1-3h hole in live data most mornings, right at peak production. `workflow_dispatch`
# events start within seconds, so only a chain's first link depends on the scheduler.
#
# The `schedule:` entries below only revive the chain if it ever dies (a failed dispatch,
# a GitHub outage): a scheduled run exits immediately if any other chain run is active. If
# two chains ever coexist, collect_handoff.sh's newest-wins rule ends the older one at its
# next handoff. `hops` (default -1 = unlimited) can bound a chain - handy for testing a
# short chain from a branch without starting one that runs forever.
#
# Overlapping runs mean collect.py genuinely runs concurrently with itself - verified safe:
# every insert is `INSERT OR IGNORE` keyed on `timestamp`, and the single-row
# `collector_state` upsert uses `ON CONFLICT DO UPDATE`, both atomic at the DB level. No
# `concurrency:` lock - that would queue the successor instead of overlapping it.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "once = a single poll; chain = loop 24/7, handing off to successors"
        default: once
        type: choice
        options: [once, chain]
      hops:
        description: "chain mode: successors this run may still dispatch (-1 = unlimited)"
        default: "-1"
      max_minutes:
        description: "chain mode: this run's own length cap"
        default: "340"
  schedule:
    - cron: "17 */3 * * *" # every 3h: revive the chain if it died (no-op while it's running)

permissions:
  contents: read
  actions: write # list this workflow's runs + dispatch the successor

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355 # GitHub-hosted hard limit is 360; run_loop.py self-limits to 340
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Skip if a chain is already running
        id: guard
        if: github.event_name == 'schedule'
        run: |
          others=$(gh run list --workflow collect.yml --limit 30 --json databaseId,status,displayTitle -q "
            [.[] | select(.databaseId != ${{ github.run_id }}
                          and (.status == \"in_progress\" or .status == \"queued\")
                          and (.displayTitle | contains(\"chain\")))] | length")
          if [ "$others" -gt 0 ]; then
            echo "chain already running ($others other chain run(s) active) - nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # Streamlit Community Cloud puts the dashboard app to sleep after ~12h with no
      # traffic; one ping per run (several per day) keeps it awake without a dedicated
      # schedule. `--max-time 60` gives it room to cold-boot on the request that wakes
      # it; failure here is non-fatal and never affects collector success/failure.
      #
      # A bare `curl` here gets stuck in Streamlit Cloud's session-bootstrap redirect
      # (bounces through share.streamlit.io/-/auth/app without a real browser UA + cookie
      # jar to carry the Set-Cookie across hops, never reaching actual app content) -
      # confirmed by testing both ways. `-L` + a UA + a cookie jar resolves it in 3 hops.
      - name: Ping dashboard to prevent Streamlit Cloud sleep
        if: steps.guard.outputs.skip != 'true'
        env:
          DASHBOARD_URL: ${{ secrets.DASHBOARD_URL }}
        run: |
          [ -n "$DASHBOARD_URL" ] || { echo "DASHBOARD_URL secret not set, skipping"; exit 0; }
          curl -sL --max-redirs 15 --max-time 60 -o /dev/null \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" \
            -c /tmp/streamlit_cookies.txt -b /tmp/streamlit_cookies.txt \
            -w "dashboard ping: HTTP %{http_code} after %{num_redirects} redirect(s)\n" \
            "$DASHBOARD_URL" || echo "::warning::dashboard ping failed, continuing"

      - uses: actions/checkout@v7
        if: steps.guard.outputs.skip != 'true'

      - uses: astral-sh/setup-uv@v8.3.2
        if: steps.guard.outputs.skip != 'true'
        with:
          enable-cache: true

      - run: uv sync --locked
        if: steps.guard.outputs.skip != 'true'

      - name: Collect
        if: steps.guard.outputs.skip != 'true'
        env:
          POLYCAB_TOKEN: ${{ secrets.POLYCAB_TOKEN }}
          GOODS_ID: ${{ secrets.GOODS_ID }}
          MEMBER_AUTO_ID: ${{ secrets.MEMBER_AUTO_ID }}
          BACKFILL_START_DATE: ${{ secrets.BACKFILL_START_DATE }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MODE: ${{ github.event_name == 'schedule' && 'chain' || inputs.mode }}
          HOPS: ${{ inputs.hops || '-1' }}
          MAX_MINUTES: ${{ inputs.max_minutes || '340' }}
        run: |
          uv run db/apply_schema.py  # once per job; collect.py doesn't re-run it every poll

          # collect.py exit codes: 0 ok, 1 transient network failure (self-heals, don't
          # fail the job over it), 2 auth failure, 3 API schema change - the last two need
          # a human (collect.py already sent an ntfy alert), so they fail the job.
          if [ "$MODE" != "chain" ]; then
            uv run collector/collect.py || { code=$?; [ "$code" -lt 2 ] || exit 1; }
            exit 0
          fi

          handoff=()
          if [ "$HOPS" -ne 0 ]; then
            handoff=(--handoff-cmd "bash .github/scripts/collect_handoff.sh")
          fi
          uv run collector/run_loop.py --max-minutes "$MAX_MINUTES" "${handoff[@]}"
