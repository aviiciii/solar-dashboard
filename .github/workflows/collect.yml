name: Collect solar readings

# Polls every 5 minutes through the 05:30-19:00 IST collection window as a CHAIN of runs:
# each run loops internally (collector/run_loop.py, real `sleep`, clock-aligned) for up to
# 340 min - a GitHub-hosted job dies at 6h - and ~10 min before that cap dispatches its own
# successor via `gh workflow run`, so the two overlap briefly instead of leaving a gap.
#
# Why chain instead of one `schedule:` entry per segment: GitHub's scheduler has been
# starting these runs 3.5-4.5h late, every day (observed Oct 2026 - far worse than the
# "tens of minutes" of jitter fixed segments with 1h overlaps were sized for), which left a
# 1-3h hole in live data most mornings, right at peak production. `workflow_dispatch`
# events start within seconds, so only the chain's first link depends on the scheduler.
#
# The `schedule:` entries below just start (or revive) the chain. A scheduled run exits
# immediately if any other run of this workflow is already in progress, so normally only
# the first kickoff of the day does anything; the later ones are a safety net in case a
# handoff ever fails. A run kicked off before 05:30 IST sleeps until then (counting toward
# its 340 min). `hops` caps how many successors a chain may spawn (~3 runs cover a day),
# so a bug can never chain forever.
#
# Overlapping runs mean collect.py genuinely runs concurrently with itself - verified safe:
# every insert is `INSERT OR IGNORE` keyed on `timestamp`, and the single-row
# `collector_state` upsert uses `ON CONFLICT DO UPDATE`, both atomic at the DB level. No
# `concurrency:` lock - that would queue the successor instead of overlapping it.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: "once = a single poll; chain = loop through today's window, handing off to successors"
        default: once
        type: choice
        options: [once, chain]
      hops:
        description: "chain mode: max number of successor runs this run may still dispatch"
        default: "3"
      max_minutes:
        description: "chain mode: this run's own length cap"
        default: "340"
      start:
        description: "chain mode: first poll no earlier than (IST HH:MM)"
        default: "05:30"
      until:
        description: "chain mode: stop time today (IST HH:MM)"
        default: "19:00"
  schedule:
    - cron: "30 20 * * *" # 02:00 IST - three early kickoffs, since GH routinely
    - cron: "30 21 * * *" # 03:00 IST   starts these hours late; whichever arrives
    - cron: "30 22 * * *" # 04:00 IST   first starts the day's chain
    - cron: "30 2 * * *"  # 08:00 IST - revive the chain if a handoff failed
    - cron: "30 5 * * *"  # 11:00 IST
    - cron: "30 8 * * *"  # 14:00 IST

permissions:
  contents: read
  actions: write # list this workflow's runs + dispatch the successor

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355 # GitHub-hosted hard limit is 360; run_loop.py self-limits to 340
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - name: Skip if a chain is already running
        id: guard
        if: github.event_name == 'schedule'
        run: |
          others=$(gh run list --workflow collect.yml --status in_progress --json databaseId \
            -q "[.[] | select(.databaseId != ${{ github.run_id }})] | length")
          if [ "$others" -gt 0 ]; then
            echo "chain already running ($others other run(s) in progress) - nothing to do"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # Streamlit Community Cloud puts the dashboard app to sleep after ~12h with no
      # traffic; one ping per run (several per day) keeps it awake without a dedicated
      # schedule. `--max-time 60` gives it room to cold-boot on the request that wakes
      # it; failure here is non-fatal and never affects collector success/failure.
      #
      # A bare `curl` here gets stuck in Streamlit Cloud's session-bootstrap redirect
      # (bounces through share.streamlit.io/-/auth/app without a real browser UA + cookie
      # jar to carry the Set-Cookie across hops, never reaching actual app content) -
      # confirmed by testing both ways. `-L` + a UA + a cookie jar resolves it in 3 hops.
      - name: Ping dashboard to prevent Streamlit Cloud sleep
        if: steps.guard.outputs.skip != 'true'
        run: |
          curl -sL --max-redirs 15 --max-time 60 -o /dev/null \
            -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36" \
            -c /tmp/streamlit_cookies.txt -b /tmp/streamlit_cookies.txt \
            -w "dashboard ping: HTTP %{http_code} after %{num_redirects} redirect(s)\n" \
            https://homesolar.streamlit.app/ || echo "::warning::dashboard ping failed, continuing"

      - uses: actions/checkout@v7
        if: steps.guard.outputs.skip != 'true'

      - uses: astral-sh/setup-uv@v8.3.2
        if: steps.guard.outputs.skip != 'true'
        with:
          enable-cache: true

      - run: uv sync --locked
        if: steps.guard.outputs.skip != 'true'

      - name: Collect
        if: steps.guard.outputs.skip != 'true'
        env:
          POLYCAB_TOKEN: ${{ secrets.POLYCAB_TOKEN }}
          GOODS_ID: ${{ secrets.GOODS_ID }}
          MEMBER_AUTO_ID: ${{ secrets.MEMBER_AUTO_ID }}
          BACKFILL_START_DATE: ${{ secrets.BACKFILL_START_DATE }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          MODE: ${{ github.event_name == 'schedule' && 'chain' || inputs.mode }}
          HOPS: ${{ inputs.hops || '3' }}
          MAX_MINUTES: ${{ inputs.max_minutes || '340' }}
          START: ${{ inputs.start || '05:30' }}
          UNTIL: ${{ inputs.until || '19:00' }}
        run: |
          # collect.py exit codes: 0 ok, 1 transient network failure (self-heals, don't
          # fail the job over it), 2 auth failure, 3 API schema change - the last two need
          # a human (collect.py already sent an ntfy alert), so they fail the job.
          if [ "$MODE" != "chain" ]; then
            uv run collector/collect.py || { code=$?; [ "$code" -lt 2 ] || exit 1; }
            exit 0
          fi

          handoff=()
          if [ "$HOPS" -gt 0 ]; then
            next="-f mode=chain -f hops=$((HOPS - 1)) -f max_minutes=$MAX_MINUTES -f start=$START -f until=$UNTIL"
            handoff=(--handoff-cmd "gh workflow run collect.yml --ref $GITHUB_REF_NAME $next")
          fi
          uv run collector/run_loop.py --start "$START" --until "$UNTIL" \
            --max-minutes "$MAX_MINUTES" "${handoff[@]}"
