name: Daily solar summary

on:
  workflow_dispatch:
    inputs:
      report_date:
        description: "IST date to summarize (YYYY-MM-DD). Blank = today, or yesterday if run before 06:00 IST."
        required: false
        default: ""
  schedule:
    - cron: "30 13 * * *"  # 15:30 UTC = 21:00 IST

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - run: uv sync --locked

      - run: uv run alerts/daily_alert.py
        env:
          POLYCAB_TOKEN: ${{ secrets.POLYCAB_TOKEN }}
          MEMBER_AUTO_ID: ${{ secrets.MEMBER_AUTO_ID }}
          TURSO_DATABASE_URL: ${{ secrets.TURSO_DATABASE_URL }}
          TURSO_AUTH_TOKEN: ${{ secrets.TURSO_AUTH_TOKEN }}
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
          WEATHER_LAT: ${{ secrets.WEATHER_LAT }}
          WEATHER_LON: ${{ secrets.WEATHER_LON }}
          REPORT_DATE: ${{ github.event.inputs.report_date }}

      # Without this a failed run (expired token, API down, crash) just means no summary
      # arrives - easy to miss. Same alert pattern as the backup workflow.
      - name: Alert on failure
        if: failure()
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: |
          curl -s --max-time 15 -H "Title: Solar daily summary" \
            -d "Daily summary failed to send - see ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            "https://ntfy.sh/$NTFY_TOPIC" || true
